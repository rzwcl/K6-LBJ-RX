name: Generate and commit validated TDCSRX Thumb disassembly

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-tdcsrx-disassembly.yml"
      - "tools/disassemble_tdcsrx_app.py"

permissions:
  contents: write

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: \${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Capstone
        run: python -m pip install --disable-pip-version-check capstone
      - name: Verify and disassemble original TDCSRX RX 0.3 FAP1
        run: |
          python tools/disassemble_tdcsrx_app.py \
            --output research/tdcsrx_rx03/TDCSRX_RX03_THUMB_DISASSEMBLY.md \
            --raw-disassembly research/tdcsrx_rx03/TDCSRX_RX03_THUMB_DISASSEMBLY.asm
      - name: Commit reproducible disassembly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/tdcsrx_rx03/TDCSRX_RX03_THUMB_DISASSEMBLY.md \
                  research/tdcsrx_rx03/TDCSRX_RX03_THUMB_DISASSEMBLY.asm
          if git diff --cached --quiet; then
            echo "Disassembly is already current."
            exit 0
          fi
          git commit -m "research: commit validated TDCSRX Thumb disassembly"
          git push origin HEAD:main
