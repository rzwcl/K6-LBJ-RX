name: Build K6 LBJ RX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "FirmwareOverlay/**"
      - "tools/**"
      - ".github/workflows/build-lbj.yml"

permissions:
  contents: write

jobs:
  build-lbj:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout LBJ project
        uses: actions/checkout@v4

      - name: Install ARM GCC and Python packer dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi python3-crcmod

      - name: Fetch pinned upstream LOSEHU source
        run: |
          git clone --depth 1 --branch 0.13.2 https://github.com/losehu/uv-k5-firmware-custom.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "021656ea13226d349e31acd6eb21079c5bab64c7"

      - name: Verify uploaded baseline firmware image
        run: |
          python3 tools/verify_losehu_packed.py "LOSEHU132HS(MDC尾音).bin" \
            --packer upstream/fw-pack.py \
            --report baseline-firmware-report.json

      - name: Validate overlay integration anchors
        run: python3 tools/install_overlay.py upstream --dry-run

      - name: Install LBJ overlay into isolated upstream checkout
        run: python3 tools/install_overlay.py upstream

      - name: Verify overlay installation is idempotent
        run: python3 tools/install_overlay.py upstream --dry-run

      - name: Build Chinese LBJ receiver firmware
        working-directory: upstream
        run: |
          make build \
            ENABLE_LBJ=1 \
            ENABLE_MESSENGER=0 \
            ENABLE_MDC1200=0 \
            ENABLE_AIRCOPY=0 \
            ENABLE_CHINESE_FULL=4 \
            ENABLE_PINYIN=0 \
            ENABLE_4732=0 \
            ENABLE_4732SSB=0 \
            ENABLE_SPECTRUM=0 \
            ENABLE_DOPPLER=0 \
            ENABLE_FMRADIO=0

      - name: Verify generated packed firmware
        working-directory: upstream
        run: |
          packed="$(find . -maxdepth 1 -type f -name 'LOSEHU*.bin' -print -quit)"
          test -n "$packed"
          python3 ../tools/verify_losehu_packed.py "$packed" \
            --packer fw-pack.py \
            --report lbj-build-report.json

      - name: Verify linked image size and packer output
        working-directory: upstream
        run: |
          set -euo pipefail
          test -s firmware
          test -s firmware.bin
          packed="$(find . -maxdepth 1 -type f -name 'LOSEHU*.bin' -print -quit)"
          test -n "$packed"
          raw_size="$(stat -c '%s' firmware.bin)"
          packed_size="$(stat -c '%s' "$packed")"
          echo "Raw firmware: $raw_size bytes"
          echo "Packed firmware: $packed_size bytes"
          arm-none-eabi-size firmware
          test "$raw_size" -le 61440
          test "$packed_size" -eq "$((raw_size + 18))"
          echo "PACKED_IMAGE=$packed" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: K6-LBJ-RX-LOSEHU132K
          if-no-files-found: error
          path: |
            upstream/firmware
            upstream/firmware.bin
            upstream/firmware.map
            upstream/LOSEHU*.bin
            baseline-firmware-report.json
            upstream/lbj-build-report.json

      - name: Publish LBJ firmware into CA folder
        env:
          PUBLISH_BRANCH: feature/k6-overlay-apps
        run: |
          set -euo pipefail
          source_bin="$(find upstream -maxdepth 1 -type f -name 'LOSEHU*.bin' -print -quit)"
          test -n "$source_bin"
          worktree="$RUNNER_TEMP/ca-publish"
          for attempt in 1 2 3 4 5; do
            git fetch origin "+refs/heads/${PUBLISH_BRANCH}:refs/remotes/origin/${PUBLISH_BRANCH}"
            git worktree add --detach "$worktree" "origin/${PUBLISH_BRANCH}"
            mkdir -p "$worktree/CA/Firmware"
            cp "$source_bin" "$worktree/CA/Firmware/K6-LBJ-RX-LOSEHU132K.bin"
            git -C "$worktree" add "CA/Firmware/K6-LBJ-RX-LOSEHU132K.bin"
            if git -C "$worktree" diff --cached --quiet; then
              echo "Published firmware is already current."
              git worktree remove --force "$worktree"
              exit 0
            fi
            git -C "$worktree" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: update K6 LBJRX firmware in CA"
            if git -C "$worktree" push origin "HEAD:refs/heads/${PUBLISH_BRANCH}"; then
              git worktree remove --force "$worktree"
              exit 0
            fi
            git worktree remove --force "$worktree"
            sleep 2
          done
          echo "Could not publish firmware to ${PUBLISH_BRANCH} after 5 attempts." >&2
          exit 1

