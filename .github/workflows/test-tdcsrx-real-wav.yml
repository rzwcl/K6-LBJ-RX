name: Probe TDCSRX DSP with real 457.550 MHz recording

on:
  workflow_dispatch:
  push:
    paths:
      - "research/tdcsrx_rx03/tdcsrx_recovered_dsp.c"
      - "research/tdcsrx_rx03/test_tdcsrx_real_wav.c"
      - "research/tdcsrx_rx03/prepare_real_wav.py"
      - "research/tdcsrx_rx03/compare_real_wav_bits.py"
      - "research/tdcsrx_rx03/Makefile"
      - ".github/workflows/test-tdcsrx-real-wav.yml"

permissions:
  contents: read

jobs:
  real-wav-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reference demodulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sox
          python3 -m pip install --user numpy
      - name: Download pinned 457.550 MHz recording
        run: |
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/rzwcl/450-TAx2/main/2026-10-11_17-30-46_audio_457550000Hz.wav" \
            --output sample.wav
      - name: Prepare 9.6 kHz target samples and 48 kHz reference audio
        run: |
          python3 research/tdcsrx_rx03/prepare_real_wav.py sample.wav sample-9600-adc.bin
          sox sample.wav -b 16 -e signed-integer -c 1 -r 48000 sample-48k.wav rate -h 48000
      - name: Run recovered target DSP and compare decisions with reference
        run: |
          set +e
          make -C research/tdcsrx_rx03 probe-real-wav SAMPLE_BIN="$GITHUB_WORKSPACE/sample-9600-adc.bin"
          probe_status=$?
          set -e
          python3 research/tdcsrx_rx03/compare_real_wav_bits.py sample-48k.wav
          exit $probe_status
      - name: Clean test executables
        if: always()
        run: make -C research/tdcsrx_rx03 clean
