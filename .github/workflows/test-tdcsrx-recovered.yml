name: Test recovered TDCSRX RX 0.3 protocol and frame path

on:
  push:
    paths:
      - "research/tdcsrx_rx03/**"
      - ".github/workflows/test-tdcsrx-recovered.yml"
  pull_request:
    paths:
      - "research/tdcsrx_rx03/**"
      - ".github/workflows/test-tdcsrx-recovered.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-frame-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test recovered protocol, BCH, sync, and frame collectors
        run: make -C research/tdcsrx_rx03 test-protocol
      - name: Clean test executables
        if: always()
        run: make -C research/tdcsrx_rx03 clean
