name: Test recovered TDCSRX RX 0.3 protocol path

on:
  push:
    paths:
      - "research/tdcsrx_rx03/**"
      - ".github/workflows/test-tdcsrx-recovered.yml"
  pull_request:
    paths:
      - "research/tdcsrx_rx03/**"
      - ".github/workflows/test-tdcsrx-recovered.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test recovered TDCSRX layers
        run: make -C research/tdcsrx_rx03 test
      - name: Clean test executables
        if: always()
        run: make -C research/tdcsrx_rx03 clean
