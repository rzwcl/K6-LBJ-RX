name: Package TDCSRX recovered source

on:
  push:
    branches: [main]
    paths:
      - "research/tdcsrx_rx03/**"
      - ".github/workflows/package-tdcsrx-recovered.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout recovered research sources
        uses: actions/checkout@v4

      - name: Run validated recovered protocol/frame tests
        run: make -C research/tdcsrx_rx03 test-protocol

      - name: Remove host test executables
        if: always()
        run: make -C research/tdcsrx_rx03 clean

      - name: Package source and reverse-engineering notes
        run: |
          mkdir -p dist
          zip -r dist/TDCSRX-RX03-recovered-source.zip \
            research/tdcsrx_rx03

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: TDCSRX-RX03-recovered-source
          if-no-files-found: error
          path: dist/TDCSRX-RX03-recovered-source.zip
